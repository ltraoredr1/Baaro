[package]
name = "baaro-media"
version = "0.1.0"
edition = "2021"
description = "Détection de type de fichier par signature pour le worker BAARO"
license = "MIT"
publish = false

# Aucun crate externe : binaire léger et build reproductible.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
