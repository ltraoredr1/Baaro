[package]
name = "baaro-media"
version = "0.1.0"
edition = "2021"
description = "Outils média du worker BAARO : détection de type par signature et découpage WebVTT"
license = "MIT"
publish = false

# Aucune dépendance externe : binaire petit, build reproductible, rien à auditer.
[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
