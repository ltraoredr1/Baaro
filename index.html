<!doctype html>
<html lang="fr" data-theme="light" data-mode="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5"
    />
    <title>BAARO — Réseau social, vidéo, communautés & IA</title>
    <meta
      name="description"
      content="BAARO : réseau social international pour publier, créer, discuter, découvrir et collaborer."
    />
    <meta name="theme-color" content="#FAF7F0" />
    <meta name="color-scheme" content="light dark" />

    <!-- Applique le thème enregistré avant le premier affichage (évite le flash) -->
    <script>
      try {
        var t = localStorage.getItem('baaro_theme') || 'light';
        var r = document.documentElement;
        r.setAttribute('data-theme', t);
        r.setAttribute('data-mode', t === 'light' ? 'light' : 'dark');
        var bgs = { light:'#FAF7F0', midnight:'#0B1220', oled:'#000000', emerald:'#061A14',
                    sunset:'#2A1215', ocean:'#0A1628', forest:'#0E1F14', desert:'#1F1A14' };
        var m = document.querySelector('meta[name="theme-color"]');
        if (m && bgs[t]) m.setAttribute('content', bgs[t]);
      } catch (e) {}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="./brand/baaro-logo.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BAARO" />
    <meta name="mobile-web-app-capable" content="yes" />

    <meta property="og:title" content="BAARO" />
    <meta
      property="og:description"
      content="Réseau social mondial pour créer, découvrir, discuter et collaborer avec un assistant IA."
    />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Aller au contenu</a>
    <div id="root"></div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
