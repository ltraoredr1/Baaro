name: Generate package-lock.json

# Manuel uniquement : commite package-lock.json avec package.json depuis ton poste.
# Ce workflow sert de secours et ne supprime plus le lockfile existant
# (les versions ne changent que si package.json l'exige).
on:
  workflow_dispatch:

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update package-lock.json
        run: npm install --package-lock-only

      - name: Commit package-lock.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update package-lock.json [skip ci]"
          file_pattern: "package-lock.json"
