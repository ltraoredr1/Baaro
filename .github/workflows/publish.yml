name: DEPRECATED - ancienne publication web (ne pas utiliser)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    name: Arrêt sécurisé du workflow obsolète
    runs-on: ubuntu-24.04
    steps:
      - name: Orienter vers le workflow APK natif
        run: |
          echo "Ce workflow publiait un ZIP web incompatible avec l'updater Android natif."
          echo "Utilisez Actions > Publier BAARO - Updater Maison (android-build.yml) pour produire l'APK signé et son manifeste." >&2
          exit 1
