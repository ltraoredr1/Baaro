name: Publier BAARO - Updater Maison

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    name: Publication manuelle BAARO
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CLANG: clang-18
    steps:
      - name: Vérifier la branche
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Publication autorisée uniquement depuis main."
            exit 1
          fi

      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust 1.99.1
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: wasm32-unknown-unknown

      - name: Install Clang 18 and LLD 18
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18

      - name: Installer Node.js 22.23.4
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm

      - name: Installer les dépendances
        run: npm ci --prefer-offline --no-audit

      - name: Générer une version unique
        run: |
          BASE=$(node -p "require('./package.json').version")
          MAJMIN=$(echo "$BASE" | cut -d. -f1-2)
          NEW="$MAJMIN.${GITHUB_RUN_NUMBER}"
          npm version "$NEW" --no-git-tag-version --allow-same-version
          echo "Version publiée : $NEW"

      - name: Construire BAARO
        run: npm run build
        env:
          VITE_APP_ENV: production
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          VITE_DAILY_DOMAIN: ${{ secrets.VITE_DAILY_DOMAIN }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VITE_BAARO_MEDIA_WORKER_URL: ${{ secrets.VITE_BAARO_MEDIA_WORKER_URL }}

      - name: Créer le bundle Updater Maison
        run: node scripts/build-update.mjs

      - name: Publier la mise à jour pour tous
        run: |
          git config user.name "baaro-release-bot"
          git config user.email "release@baaro.app"
          git add package.json package-lock.json public/updates/
          git commit -m "release: publie la version $(node -p "require('./package.json').version") pour tous les utilisateurs" || echo "Rien à publier"
          git push
