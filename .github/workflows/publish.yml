name: Publier mise à jour BAARO

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Run ID du workflow Build BAARO Android APK dont l’artefact a été validé"
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: baaro-android-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Vérifier et publier la GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Vérifier la branche de publication
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "::error::La publication doit être lancée depuis main."
            exit 1
          }

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.2"

      - name: Récupérer le dépôt et les tags
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Installer Android SDK pour vérifier la signature
        uses: android-actions/setup-android@v3

      - name: Installer les outils de signature Android
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Vérifier que le Run ID est un build réussi de main
        env:
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]] || {
            echo "::error::Le Run ID doit être numérique."
            exit 1
          }
          HTTP_CODE="$(curl --silent --show-error --output "$RUNNER_TEMP/build-run.json" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID")"
          test "$HTTP_CODE" = "200" || {
            echo "::error::Impossible de lire ce run GitHub Actions (HTTP $HTTP_CODE)."
            exit 1
          }
          node --input-type=module - "$RUNNER_TEMP/build-run.json" <<'NODE'
          import fs from "node:fs";
          const run = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (run.path !== ".github/workflows/android-build.yml"
              || run.event !== "workflow_dispatch"
              || run.head_branch !== "main"
              || run.status !== "completed"
              || run.conclusion !== "success") {
            console.error("Le Run ID doit désigner un build APK manuel réussi depuis main.");
            process.exit(1);
          }
          console.log(`Build validé : run ${run.id}, commit source ${run.head_sha}`);
          NODE

      - name: Télécharger l’artefact du build choisi
        uses: actions/download-artifact@v4
        with:
          name: baaro-apk
          path: release
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}

      - name: Vérifier la provenance, le manifeste, la taille et la signature
        id: verify
        env:
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s release/build-info.json
          test -s release/manifest.json
          node --input-type=module - <<'NODE'
          import fs from "node:fs";
          import crypto from "node:crypto";
          const build = JSON.parse(fs.readFileSync("release/build-info.json", "utf8"));
          const manifest = JSON.parse(fs.readFileSync("release/manifest.json", "utf8"));
          const runId = process.env.BUILD_RUN_ID;
          const versionPattern = /^\d+\.\d+\.\d+$/;
          if (String(build.buildRunId) !== runId) throw new Error("L’artefact ne correspond pas au Run ID sélectionné.");
          if (!versionPattern.test(build.version || "")) throw new Error("Version de build invalide.");
          if (!/^[a-f0-9]{40}$/i.test(build.sourceSha || "")) throw new Error("Commit source absent ou invalide.");
          if (manifest.appId !== "com.baaro.app" || manifest.version !== build.version) throw new Error("Identité/version du manifeste incohérente.");
          const parts = build.version.split(".").map(Number);
          const versionCode = parts[0] * 1000000 + parts[1] * 1000 + parts[2];
          if (manifest.versionCode !== versionCode) throw new Error("versionCode du manifeste incorrect.");
          if (!/^[a-f0-9]{64}$/i.test(build.sha256 || "") || manifest.sha256?.toLowerCase() !== build.sha256.toLowerCase()) throw new Error("SHA-256 du manifeste invalide ou incohérent.");
          const expectedApk = `baaro-v${build.version}.apk`;
          if (build.apkName !== expectedApk) throw new Error("Nom de l’APK inattendu.");
          const expectedUrl = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/v${build.version}/${expectedApk}`;
          if (manifest.apkUrl !== expectedUrl) throw new Error("URL de l’APK dans le manifeste invalide.");
          NODE

          BUILD_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('release/build-info.json','utf8')).version")"
          SOURCE_SHA="$(node -p "JSON.parse(require('fs').readFileSync('release/build-info.json','utf8')).sourceSha")"
          APK_NAME="$(node -p "JSON.parse(require('fs').readFileSync('release/build-info.json','utf8')).apkName")"
          EXPECTED_SHA256="$(node -p "JSON.parse(require('fs').readFileSync('release/build-info.json','utf8')).sha256")"
          APK="release/$APK_NAME"
          test -s "$APK"
          ACTUAL_SHA256="$(sha256sum "$APK" | cut -d' ' -f1)"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256" || {
            echo "::error::L’empreinte de l’APK ne correspond pas au manifeste."
            exit 1
          }
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

          git fetch origin main --tags
          git cat-file -e "$SOURCE_SHA^{commit}"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main || {
            echo "::error::Le commit du build n’appartient plus à l’historique de main."
            exit 1
          }
          SOURCE_VERSION="$(git show "$SOURCE_SHA:package.json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).version))')"
          test "$SOURCE_VERSION" = "$BUILD_VERSION" || {
            echo "::error::La version du commit source ne correspond pas à l’APK."
            exit 1
          }
          if [ -n "$(git ls-remote origin "refs/tags/v$BUILD_VERSION")" ]; then
            echo "::error::Le tag v$BUILD_VERSION existe déjà."
            exit 1
          fi

          LATEST_CODE="$(curl --silent --show-error --output "$RUNNER_TEMP/latest-release.json" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/latest")"
          if [ "$LATEST_CODE" = "200" ]; then
            node --input-type=module - "$RUNNER_TEMP/latest-release.json" "$BUILD_VERSION" <<'NODE'
          import fs from "node:fs";
          const latest = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const next = process.argv[3];
          const parse = (value) => {
            const match = /^v?(\d+)\.(\d+)\.(\d+)$/.exec(value || "");
            if (!match) throw new Error(`Version de Release existante non reconnue : ${value}`);
            return match.slice(1).map(Number);
          };
          const oldParts = parse(latest.tag_name);
          const newParts = parse(next);
          const cmp = newParts.findIndex((value, index) => value !== oldParts[index]);
          const isNewer = cmp === -1 ? false : newParts[cmp] > oldParts[cmp];
          if (!isNewer) throw new Error(`La version ${next} doit être supérieure à la dernière Release ${latest.tag_name}.`);
          NODE
          elif [ "$LATEST_CODE" != "404" ]; then
            echo "::error::Impossible de vérifier la dernière Release (HTTP $LATEST_CODE)."
            exit 1
          fi
          {
            echo "version=$BUILD_VERSION"
            echo "source_sha=$SOURCE_SHA"
            echo "apk_name=$APK_NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Publier la mise à jour aux utilisateurs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.verify.outputs.version }}
          name: BAARO v${{ steps.verify.outputs.version }}
          target_commitish: ${{ steps.verify.outputs.source_sha }}
          files: |
            release/manifest.json
            release/${{ steps.verify.outputs.apk_name }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
