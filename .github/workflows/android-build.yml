      - name: Verify required secrets
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          set -euo pipefail

          check_url() {
            local name="$1" value="$2"
            if [[ -z "$value" ]]; then
              echo "::error::Le secret $name est manquant."
              exit 1
            fi
            if [[ "$value" =~ [[:space:]] ]]; then
              echo "::error::Le secret $name contient un espace ou un retour à la ligne."
              exit 1
            fi
            if [[ ! "$value" =~ ^https:// ]]; then
              echo "::error::Le secret $name doit commencer par https://"
              exit 1
            fi
          }

          check_url VITE_SUPABASE_URL "${VITE_SUPABASE_URL:-}"
          check_url VITE_API_BASE_URL "${VITE_API_BASE_URL:-}"

          if [[ -z "${VITE_SUPABASE_ANON_KEY:-}" ]]; then
            echo "::error::Le secret VITE_SUPABASE_ANON_KEY est manquant."
            exit 1
          fi

          echo "Secrets valides."
          echo "Commit : ${GITHUB_SHA}"
