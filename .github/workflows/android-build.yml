name: BAARO Android Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Type de mise à jour"
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

concurrency:
  group: baaro-android-release
  cancel-in-progress: false

jobs:
  build:
    name: Build APK Release signé
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CLANG: clang-18

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.2"
          cache: npm

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer les composants Android
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Installer Clang 18 et LLD 18
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18

      - name: Installer Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - name: Vérifier les secrets de configuration
        env:
          VITE_APP_ENV: production
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in \
            VITE_SUPABASE_URL \
            VITE_SUPABASE_ANON_KEY \
            VITE_API_BASE_URL \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEY_ALIAS \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_PASSWORD
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::Secret manquant : $name"
              exit 1
            fi
          done

          echo "Configuration et secrets présents."

      - name: Restaurer la clé de signature
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          KEYSTORE_PATH="$RUNNER_TEMP/baaro.jks"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

          if [ ! -s "$KEYSTORE_PATH" ]; then
            echo "::error::Keystore vide ou invalide."
            exit 1
          fi

          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

          echo "Clé de signature restaurée."

      - name: Installer les dépendances
        run: npm ci

      - name: Mettre à jour la version
        env:
          VERSION_BUMP: ${{ inputs.version }}
        run: |
          set -euo pipefail
          npm version "$VERSION_BUMP" --no-git-tag-version
          echo "Version de l'application : $(node -p "require('./package.json').version")"

      - name: Construire l'application Web
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          VITE_DAILY_DOMAIN: ${{ secrets.VITE_DAILY_DOMAIN }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VITE_BAARO_MEDIA_WORKER_URL: ${{ secrets.VITE_BAARO_MEDIA_WORKER_URL }}
        run: |
          set -euo pipefail
          npm run build

          if [ ! -f dist/index.html ]; then
            echo "::error::Build Web incomplet : dist/index.html absent."
            exit 1
          fi

      - name: Vérifier les assets Whisper
        run: |
          set -euo pipefail
          test -s dist/ort/ort-wasm-simd-threaded.asyncify.mjs
          test -s dist/ort/ort-wasm-simd-threaded.asyncify.wasm

      - name: Générer le paquet de mise à jour Web
        run: |
          set -euo pipefail
          node scripts/build-update.mjs

      - name: Synchroniser Capacitor
        run: |
          set -euo pipefail
          npx cap sync android

      - name: Vérifier la configuration Android
        run: |
          set -euo pipefail
          node scripts/check-android.mjs

      - name: Construire l'APK Release signé
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Vérifier la signature APK
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/release/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK Release introuvable."
            exit 1
          fi

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"

          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner introuvable."
            exit 1
          fi

          "$APKSIGNER" verify --verbose --print-certs "$APK"

          echo "Signature APK vérifiée."

      - name: Publier l'APK comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: baaro-android-release-${{ github.run_number }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
