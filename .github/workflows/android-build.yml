name: Build BAARO Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Incrément de version de l’APK"
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: baaro-android-build
  cancel-in-progress: false

jobs:
  build:
    name: Construire et archiver l’APK signé
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Récupérer main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Vérifier la branche
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "::error::Le build officiel doit être lancé depuis main."
            exit 1
          }

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.2"
          cache: npm

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer les composants Android
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Vérifier les secrets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY VITE_API_BASE_URL ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Secret manquant : $name"
              exit 1
            fi
          done

      - name: Restaurer et vérifier la clé officielle BAARO
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/baaro.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Installer les dépendances
        run: npm ci

      - name: Incrémenter la version dans l’espace de travail
        env:
          VERSION_BUMP: ${{ inputs.version }}
        run: |
          set -euo pipefail
          npm version "$VERSION_BUMP" --no-git-tag-version
          VERSION="$(node -p "require('./package.json').version")"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Version à construire : $VERSION"

      - name: Construire l’application Web
        env:
          VITE_APP_ENV: production
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          VITE_DAILY_DOMAIN: ${{ secrets.VITE_DAILY_DOMAIN }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VITE_BAARO_MEDIA_WORKER_URL: ${{ secrets.VITE_BAARO_MEDIA_WORKER_URL }}
        run: |
          set -euo pipefail
          npm run build
          test -s dist/index.html
          test -s dist/ort/ort-wasm-simd-threaded.asyncify.mjs
          test -s dist/ort/ort-wasm-simd-threaded.asyncify.wasm

      - name: Synchroniser Capacitor
        run: npx cap sync android

      - name: Vérifier Android et l’updater en flux
        run: node scripts/check-android.mjs

      - name: Construire l’APK signé
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Vérifier la signature officielle
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Préparer APK et manifeste comme artefact
        id: package
        run: |
          set -euo pipefail
          mkdir -p release
          APK_NAME="baaro-v$VERSION.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "release/$APK_NAME"
          APK_SHA256="$(sha256sum "release/$APK_NAME" | cut -d' ' -f1)"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          echo "APK_SHA256=$APK_SHA256" >> "$GITHUB_ENV"
          node --input-type=module - "$VERSION" "$GITHUB_REPOSITORY" "$APK_SHA256" "$APK_NAME" <<'NODE'
          import fs from "node:fs";
          const [version, repository, sha256, apkName] = process.argv.slice(2);
          const parts = version.split(".").map(Number);
          const versionCode = parts[0] * 1000000 + parts[1] * 1000 + parts[2];
          const manifest = {
            appId: "com.baaro.app",
            version,
            versionCode,
            apkUrl: `https://github.com/${repository}/releases/download/v${version}/${apkName}`,
            sha256,
            mandatory: false,
            notes: `Mise à jour officielle BAARO ${version}`
          };
          fs.writeFileSync("release/manifest.json", JSON.stringify(manifest, null, 2) + "\n");
          NODE

      - name: Enregistrer la version seulement après le build réussi
        id: version_commit
        run: |
          set -euo pipefail
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "::error::main a changé pendant le build; aucun bump automatique ne sera poussé. Relancez le workflow sur le nouveau main."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(release): prépare BAARO v$VERSION"
          git push origin HEAD:main
          SOURCE_SHA="$(git rev-parse HEAD)"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          node --input-type=module - "$VERSION" "$SOURCE_SHA" "$GITHUB_RUN_ID" "$APK_NAME" "$APK_SHA256" <<'NODE'
          import fs from "node:fs";
          const [version, sourceSha, buildRunId, apkName, sha256] = process.argv.slice(2);
          fs.writeFileSync("release/build-info.json", JSON.stringify({
            version,
            sourceSha,
            buildRunId,
            apkName,
            sha256
          }, null, 2) + "\n");
          NODE

      - name: Archiver l’APK signé pour la publication manuelle
        uses: actions/upload-artifact@v4
        with:
          name: baaro-apk
          path: release/
          if-no-files-found: error
          retention-days: 30

      - name: Résumé et identifiant de run à publier
        run: |
          {
            echo "## APK BAARO prêt à valider"
            echo "- Version : $VERSION"
            echo "- Artefact : baaro-apk"
            echo "- Run ID à transmettre au workflow de publication : $GITHUB_RUN_ID"
            echo "- Aucune GitHub Release n’a été publiée par ce workflow."
            echo ""
            echo "Après validation, lancer manuellement **Publier mise à jour BAARO** avec ce Run ID."
          } >> "$GITHUB_STEP_SUMMARY"
