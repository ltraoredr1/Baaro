name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version à publier (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CLANG: clang-18
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust 1.99.1
        uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: wasm32-unknown-unknown

      - name: Install Clang 18 and LLD 18
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18

      - name: Setup Node.js 22.23.4
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify required secrets
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
        run: |
          set -euo pipefail
          check_url() {
            local name="$1" value="$2"
            if [[ -z "$value" ]]; then
              echo "::error::Le secret $name est manquant."
              exit 1
            fi
            if [[ "$value" =~ [[:space:]] ]]; then
              echo "::error::Le secret $name contient un espace ou un retour à la ligne."
              exit 1
            fi
            if [[ ! "$value" =~ ^https:// ]]; then
              echo "::error::Le secret $name doit commencer par https://"
              exit 1
            fi
          }
          check_url VITE_SUPABASE_URL "${VITE_SUPABASE_URL:-}"
          check_url VITE_API_BASE_URL "${VITE_API_BASE_URL:-}"
          if [[ -z "${VITE_SUPABASE_ANON_KEY:-}" ]]; then
            echo "::error::Le secret VITE_SUPABASE_ANON_KEY est manquant."
            exit 1
          fi
          echo "Secrets valides."
          echo "Commit : ${GITHUB_SHA}"
          echo "Date UTC : $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Bump version
        run: npm version ${{ inputs.version }} --no-git-tag-version

      - name: Build web application
        run: npm run build
        env:
          VITE_APP_ENV: production
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          VITE_DAILY_DOMAIN: ${{ secrets.VITE_DAILY_DOMAIN }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VITE_BAARO_MEDIA_WORKER_URL: ${{ secrets.VITE_BAARO_MEDIA_WORKER_URL }}

      - name: Verify Whisper runtime assets
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/ort/ort-wasm-simd-threaded.asyncify.mjs
          test -s dist/ort/ort-wasm-simd-threaded.asyncify.wasm

      - name: Create Updater Maison bundle
        run: node scripts/build-update.mjs

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -s "$APK" ]]; then
            echo "::error::APK absent ou vide : $APK"
            exit 1
          fi
          ls -lh "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish update manifest for all users
        run: |
          git config user.name "baaro-release-bot"
          git config user.email "release@baaro.app"
          git add package.json package-lock.json public/updates/
          git commit -m "release: publie la version $(node -p "require('./package.json').version") pour tous les utilisateurs" || echo "Rien à publier"
          git push
