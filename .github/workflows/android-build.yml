name: Publier BAARO - Updater Maison

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier"
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: baaro-updater-maison
  cancel-in-progress: false

jobs:
  publish:
    name: Publier une mise à jour BAARO officielle
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Vérifier la branche de publication
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "::error::La publication est autorisée uniquement depuis main."
            exit 1
          }

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.22.2"
          cache: npm

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Installer les composants Android
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Vérifier les secrets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY VITE_API_BASE_URL ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Secret manquant : $name"
              exit 1
            fi
          done

      - name: Restaurer et vérifier la clé officielle BAARO
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/baaro.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -alias "$ANDROID_KEY_ALIAS" -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Installer les dépendances
        run: npm ci

      - name: Incrémenter et enregistrer durablement la version
        env:
          VERSION_BUMP: ${{ inputs.version }}
        run: |
          set -euo pipefail
          npm version "$VERSION_BUMP" --no-git-tag-version
          VERSION="$(node -p "require('./package.json').version")"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(release): BAARO v$VERSION"
          git push origin HEAD:main

      - name: Construire l'application Web
        env:
          VITE_APP_ENV: production
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          VITE_DAILY_DOMAIN: ${{ secrets.VITE_DAILY_DOMAIN }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VITE_BAARO_MEDIA_WORKER_URL: ${{ secrets.VITE_BAARO_MEDIA_WORKER_URL }}
        run: |
          set -euo pipefail
          npm run build
          test -s dist/index.html
          test -s dist/ort/ort-wasm-simd-threaded.asyncify.mjs
          test -s dist/ort/ort-wasm-simd-threaded.asyncify.wasm

      - name: Synchroniser Capacitor
        run: npx cap sync android

      - name: Vérifier Android
        run: node scripts/check-android.mjs

      - name: Construire l'APK signé
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Vérifier la signature officielle
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Préparer APK et manifeste de mise à jour
        run: |
          set -euo pipefail
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk "release/baaro-v$VERSION.apk"
          node --input-type=module - "$VERSION" "$GITHUB_REPOSITORY" <<'NODE'
          import fs from "node:fs";
          import crypto from "node:crypto";

          const [version, repository] = process.argv.slice(2);
          const apkPath = `release/baaro-v${version}.apk`;
          const apk = fs.readFileSync(apkPath);
          const parts = version.split(".").map(Number);
          const versionCode = parts[0] * 1000000 + parts[1] * 1000 + parts[2];

          const manifest = {
            appId: "com.baaro.app",
            version,
            versionCode,
            apkUrl: `https://github.com/${repository}/releases/download/v${version}/baaro-v${version}.apk`,
            sha256: crypto.createHash("sha256").update(apk).digest("hex"),
            mandatory: false,
            notes: `Mise à jour officielle BAARO ${version}`
          };

          fs.writeFileSync("release/manifest.json", JSON.stringify(manifest, null, 2) + "\n");
          console.log(`Manifeste prêt : BAARO ${version}`);
          NODE

      - name: Créer le tag de version
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Publier la Release officielle BAARO
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: BAARO v${{ env.VERSION }}
          target_commitish: main
          files: |
            release/manifest.json
            release/baaro-v${{ env.VERSION }}.apk
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
