name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Install dependencies
      run: npm install
      
    - name: Build frontend (Vite)
      run: npm run build
      
    - name: Install Capacitor
      run: npm install @capacitor/cli @capacitor/android
      
    - name: Sync Capacitor
      run: npx cap sync android
      
    - name: Inject Nearby Chat plugin into Gradle files
      run: |
        # Vérifier que le dossier source du plugin Android existe
        if [ -d "native-plugins/nearby/android" ]; then
          if ! grep -q "nearby-chat" android/settings.gradle; then
            echo "" >> android/settings.gradle
            echo "include ':nearby-chat'" >> android/settings.gradle
            echo "project(':nearby-chat').projectDir = new File('../native-plugins/nearby/android')" >> android/settings.gradle
          fi
        else
          echo "Erreur: Le dossier native-plugins/nearby/android est introuvable."
          exit 1
        fi
        
        # Ajouter la dépendance dans app/build.gradle si elle n'y est pas
        if [ -f "android/app/build.gradle" ]; then
          if ! grep -q "nearby-chat" android/app/build.gradle; then
            sed -i "/implementation project(':capacitor-android')/a \\    implementation project(':nearby-chat')" android/app/build.gradle
          fi
        fi
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Make gradlew executable and build with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: baaro-app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
