name: Baaro - Capgo (Validation manuelle)

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Canal cible'
        required: true
        default: 'beta'
        type: choice
        options:
          - beta
          - production

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 24 - suit package.json engines
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci
      - run: npm run build

      - name: Upload - suit tes scripts package.json
        run: |
          if [ "${{ inputs.channel }}" = "beta" ]; then
            npx @capgo/cli@latest bundle upload --channel beta --apikey ${{ secrets.CAPGO_TOKEN }}
          else
            npx @capgo/cli@latest bundle upload --channel production --apikey ${{ secrets.CAPGO_TOKEN }}
          fi
