name: Baaro - Build & Deploy BETA

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4

      - name: Install deps
        run: npm ci

      - name: DEFINITIVE FIX - Auto version
        id: version
        run: |
          # On garde 0.1.0 et on ajoute le numéro de build: 0.1.0-401, 0.1.0-402...
          # C'est unique pour Capgo et tu gardes ton semver
          BASE=$(node -p "require('./package.json').version.split('-')[0]")
          NEW="$BASE-${{ github.run_number }}"
          npm version $NEW --no-git-tag-version --allow-same-version > /dev/null
          echo "version=$NEW" >> $GITHUB_OUTPUT
          echo "-> New version: $NEW"

      - name: Build Web
        run: npm run build
        env:
          VITE_APP_ENV: production
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          VITE_DAILY_DOMAIN: ${{ secrets.VITE_DAILY_DOMAIN }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VITE_BAARO_MEDIA_WORKER_URL: ${{ secrets.VITE_BAARO_MEDIA_WORKER_URL }}

      - name: Build APK Debug
        run: |
          npx cap sync android
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Baaro-${{ steps.version.outputs.version }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload to Capgo BETA & set as active
        run: npx @capgo/cli@latest bundle upload --channel beta --apikey ${{ secrets.CAPGO_TOKEN }} --bundle ${{ steps.version.outputs.version }}
