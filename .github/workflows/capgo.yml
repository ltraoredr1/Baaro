
name: Publier BAARO sur Capgo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Publication manuelle BAARO
    runs-on: ubuntu-latest

    steps:
      - name: Vérifier la branche
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Publication autorisée uniquement depuis main."
            exit 1
          fi

      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Générer une version unique
        run: |
          BASE=$(node -p "require('./package.json').version")
          MAJMIN=$(echo "$BASE" | cut -d. -f1-2)
          NEW="$MAJMIN.${GITHUB_RUN_NUMBER}"
          npm version "$NEW" --no-git-tag-version --allow-same-version
          echo "Version publiée : $NEW"

      - name: Construire BAARO
        run: npm run build
        env:
          VITE_APP_ENV: production
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          VITE_DAILY_DOMAIN: ${{ secrets.VITE_DAILY_DOMAIN }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VITE_BAARO_MEDIA_WORKER_URL: ${{ secrets.VITE_BAARO_MEDIA_WORKER_URL }}

      - name: Publier sur Capgo Production
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_TOKEN }}
        run: |
          npx @capgo/cli@latest bundle upload \
            --channel production \
            --apikey "$CAPGO_TOKEN"
