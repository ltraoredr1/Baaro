name: 2 - Publish to Users (Capgo)

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Où publier ?'
        required: true
        default: 'beta'
        type: choice
        options:
          - beta
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Auto version
        id: version
        env:
          # Numéro (#) du dernier run déjà publié dans l'onglet Actions.
          # Le run suivant donne 0.1.0, puis 0.1.1, 0.1.2, etc.
          RUN_OFFSET: 43
        run: |
          MAJMIN=$(node -p "require('./package.json').version.split('.').slice(0,2).join('.')")
          PATCH=$(( ${{ github.run_number }} - RUN_OFFSET - 1 ))
          if [ "$PATCH" -lt 0 ]; then
            echo "RUN_OFFSET trop grand : baisse-le." && exit 1
          fi
          NEW="$MAJMIN.$PATCH"
          npm version $NEW --no-git-tag-version --allow-same-version
          echo "version=$NEW" >> $GITHUB_OUTPUT

      - name: Build Web
        run: npm run build
        env:
          VITE_APP_ENV: production
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          VITE_DAILY_DOMAIN: ${{ secrets.VITE_DAILY_DOMAIN }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
          VITE_BAARO_MEDIA_WORKER_URL: ${{ secrets.VITE_BAARO_MEDIA_WORKER_URL }}

      - name: Upload to Capgo
        run: npx @capgo/cli@latest bundle upload --channel ${{ inputs.channel }} --apikey ${{ secrets.CAPGO_TOKEN }}
