name: BAARO - Dependencies and lockfile

# Un seul workflow pour :
#   1. installer tout ce qui est déclaré dans package.json,
#   2. garder package-lock.json synchronisé (mis à jour et commité si besoin),
#   3. vérifier que chaque dépendance est bien installée.
on:
  push:
    branches: [main, master]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - '.github/workflows/install-dependencies.yml'
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
    inputs:
      run_ci:
        description: "Lancer aussi npm run ci (vérifications + build)"
        type: boolean
        default: false

concurrency:
  group: baaro-dependencies-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # nécessaire seulement pour commiter package-lock.json
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci si le lockfile correspond à package.json ;
      # sinon npm install met le lockfile à jour à partir de package.json.
      - name: Install dependencies
        shell: bash
        run: |
          if npm ci; then
            echo "✅ Installation via package-lock.json (npm ci)"
          else
            echo "::warning::package-lock.json n'était pas synchronisé : mise à jour depuis package.json."
            npm install
          fi

      - name: Verify declared dependencies are installed
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const declared = ["dependencies", "devDependencies"].flatMap((g) => Object.keys(pkg[g] || {}));
            const missing = declared.filter(
              (name) => !fs.existsSync(`node_modules/${name}/package.json`)
            );
            if (missing.length) {
              console.error("Dépendances déclarées mais non installées :\n- " + missing.join("\n- "));
              process.exit(1);
            }
            console.log(`✅ ${declared.length} dépendances déclarées, toutes installées.`);
          '

      # Commit du lockfile mis à jour : uniquement sur un push vers main/master
      # (jamais sur une pull request). Sans changement, cette étape ne fait rien.
      - name: Commit updated package-lock.json
        if: ${{ github.event_name == 'push' }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update package-lock.json [skip ci]"
          file_pattern: "package-lock.json"

      - name: Run BAARO CI checks and build (optionnel)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_ci }}
        run: npm run ci

      - name: Summary
        if: success()
        run: echo "## Dépendances installées, vérifiées et lockfile synchronisé" >> "$GITHUB_STEP_SUMMARY"
