name: BAARO - Dependencies and lockfile

on:
  push:
    branches: [main, master]
    paths:
      - package.json
      - package-lock.json
      - .npmrc
      - .github/workflows/install-dependencies.yml
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - .npmrc
  workflow_dispatch:
    inputs:
      run_ci:
        description: "Lancer aussi npm run ci"
        type: boolean
        default: false

permissions:
  contents: write # tu l'as déjà corrigé, garde write

jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies and generate lockfile
        run: |
          set -euo pipefail
          test -s package.json
          npm install
          test -s package-lock.json

      - name: Verify declared dependencies are installed
        run: |
          node <<'NODE'
          const fs=require("fs"), path=require("path");
          const pkg=JSON.parse(fs.readFileSync("package.json","utf8"));
          const declared=[...Object.keys(pkg.dependencies||{}), ...Object.keys(pkg.devDependencies||{})];
          const missing=declared.filter(n=>{try{return !fs.statSync(path.join("node_modules",n,"package.json")).isFile()}catch{return true}});
          if(missing.length){console.error("Manquantes:\n- "+missing.join("\n- "));process.exit(1)}
          console.log(`OK: ${declared.length} deps`);
          NODE

      - name: Verify dependency tree
        run: npm ls --depth=0

      - name: Commit updated package-lock.json
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update package-lock.json [skip ci]"
          file_pattern: "package-lock.json"

      - name: Run BAARO CI checks and build
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_ci }}
        run: npm run ci
