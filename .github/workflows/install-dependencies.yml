name: BAARO - Dependencies and lockfile

on:
  push:
    branches: [main, master]
    paths:
      - package.json
      - package-lock.json
      - .npmrc
      - .github/workflows/install-dependencies.yml
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - .npmrc
  workflow_dispatch:
    inputs:
      run_ci:
        description: "Lancer aussi npm run ci (vérifications et build)"
        type: boolean
        default: false

concurrency:
  group: baaro-dependencies-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # <- obligatoire pour pouvoir committer le lockfile

jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and generate lockfile
        shell: bash
        run: |
          set -euo pipefail
          test -s package.json || { echo "::error::package.json absent ou vide."; exit 1; }
          npm install
          test -s package-lock.json || { echo "::error::package-lock.json non généré."; exit 1; }

      - name: Verify declared dependencies are installed
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const declared = [...Object.keys(pkg.dependencies || {}), ...Object.keys(pkg.devDependencies || {})];
          const missing = declared.filter(name => {
            try { return !fs.statSync(path.join("node_modules", name, "package.json")).isFile(); }
            catch { return true; }
          });
          if (missing.length > 0) {
            console.error("Manquantes:\n- " + missing.join("\n- "));
            process.exit(1);
          }
          console.log(`OK: ${declared.length} dépendances vérifiées.`);
          NODE

      - name: Verify dependency tree
        run: npm ls --depth=0

      - name: Commit updated package-lock.json
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update package-lock.json [skip ci]"
          file_pattern: "package-lock.json"

      - name: Run BAARO CI checks and build
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_ci }}
        run: npm run ci
